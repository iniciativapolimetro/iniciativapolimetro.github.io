# Publica en GitHub Pages SOLO la carpeta public/. La documentación interna del repo
# (CLAUDE.md, BITACORA.md, decisiones) queda fuera del sitio.
#
# Cada acción va fijada por el hash exacto de su commit, no por una etiqueta que pueda
# moverse (§10: una versión nueva no puede romper lo que ya funciona). Actualizarlas es un
# acto deliberado: una a la vez, y comprobando que el sitio se sigue publicando.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Mínimo privilegio: leer el repo y publicar en Pages, nada más.
permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; la más nueva gana.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
